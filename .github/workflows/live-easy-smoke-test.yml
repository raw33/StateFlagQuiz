name: Live Easy Mode Smoke Test

on:
  push:
    paths:
      - ".github/workflows/live-easy-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install selenium

      - name: Run live browser checks
        shell: bash
        run: |
          python3 <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          URL = "https://raw33.github.io/StateFlagQuiz/"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1280,1200")
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 20)

          try:
              found_masked_flag = False
              for attempt in range(45):
                  driver.get(f"{URL}?smoke={int(time.time())}-{attempt}")
                  wait.until(EC.presence_of_element_located((By.ID, "easyModeBtn")))

                  labels = [e.text for e in driver.find_elements(By.CSS_SELECTOR, ".difficulty-btn")]
                  assert labels == ["Easy", "Standard", "Hard"], labels
                  assert "active" in driver.find_element(By.ID, "standardModeBtn").get_attribute("class")

                  flag_src = driver.find_element(By.CSS_SELECTOR, ".flag-image-wrap img").get_attribute("src")
                  standard_masks = driver.find_elements(By.CSS_SELECTOR, ".quiz-mask")

                  easy = driver.find_element(By.ID, "easyModeBtn")
                  driver.execute_script("arguments[0].click()", easy)
                  wait.until(lambda d: "active" in d.find_element(By.ID, "easyModeBtn").get_attribute("class"))
                  assert len(driver.find_elements(By.CSS_SELECTOR, ".choice-btn")) == 4
                  assert len(driver.find_elements(By.CSS_SELECTOR, ".quiz-mask")) == 0
                  assert driver.find_element(By.CSS_SELECTOR, ".flag-image-wrap img").get_attribute("src") == flag_src

                  standard = driver.find_element(By.ID, "standardModeBtn")
                  driver.execute_script("arguments[0].click()", standard)
                  wait.until(lambda d: "active" in d.find_element(By.ID, "standardModeBtn").get_attribute("class"))
                  assert len(driver.find_elements(By.CSS_SELECTOR, ".choice-btn")) == 4

                  if standard_masks:
                      assert len(driver.find_elements(By.CSS_SELECTOR, ".quiz-mask")) > 0
                      hard = driver.find_element(By.ID, "hardModeBtn")
                      driver.execute_script("arguments[0].click()", hard)
                      wait.until(EC.presence_of_element_located((By.ID, "hardStateSearch")))
                      assert len(driver.find_elements(By.CSS_SELECTOR, ".choice-btn")) == 0
                      assert len(driver.find_elements(By.CSS_SELECTOR, ".quiz-mask")) > 0
                      found_masked_flag = True
                      print(f"PASS: live masked-flag behavior verified on attempt {attempt+1}")
                      break

              assert found_masked_flag, "Could not encounter one of the intentionally masked flags in 45 reloads"
              print("PASS: Easy / Standard / Hard live smoke test completed")
          finally:
              driver.quit()
          PY
